# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: default

# HTML Language setting
lang: "en"

# Plugins, implemented in ./plugins/PLUGIN_NAME
plugins: []

# Google Analytics tracking id
google_analytics_id:

# HTML Title
title: "Sweet Treats by Therese"

# Avatar image path (Must match exactly what you uploaded)
avatar: "./AIEnhancer_Gemini_Generated_Image_hk6lqih (1).png"

# Name section text
name: "Sweet Treats by Therese"

# Tagline section text
tagline: >-
    Custom Baking & Elegant Desserts<br>Email: akkyou29@gmail.com | Phone: (484) 951-5364

# List of links (The main buttons)
links:
