      url: "form.html"
      alt: "Custom Order Form"
      title: "Order Inquiry"
      target: "_self"
  - link:
      icon: "fa-brands fa-instagram"
      text: "Follow on Instagram (@streats.29)"
      url: "https://instagram.com/streats.29"
      alt: "Instagram Profile"
      title: "Instagram"
      target: "_blank"
  - link:
      icon: "fa-brands fa-facebook"
      text: "Follow on Facebook"
      url: "https://facebook.com/sweettreatsbytherese"
